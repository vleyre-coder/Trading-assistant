# =====================================================================
# Correspondance ticker -> raison sociale du deposant ESEF
# ---------------------------------------------------------------------
# Les depots europeens au format ESEF sont publies sur filings.xbrl.org,
# index gratuit et sans cle de l'autorite XBRL. Les societes y sont
# identifiees par leur RAISON SOCIALE exacte et par leur code LEI, jamais
# par leur ticker : cette table fait le lien.
#
# Pourquoi cette source : Yahoo Finance ne remonte que quatre exercices
# pour les titres europeens, contre cinq via EDGAR pour les americains.
# L'ecart n'est pas anodin — un taux de croissance annuel moyen sur quatre
# ans et un sur cinq ans ne sont pas comparables, et c'est l'une des
# raisons pour lesquelles aucune valeur europeenne n'apparaissait dans les
# vingt premieres places du classement.
#
# Les noms ci-dessous ont ete verifies un a un contre l'index ESEF le
# 2 septembre 2026 (7 321 deposants recenses). Le filtre de l'API exige
# une correspondance EXACTE : une faute de frappe se traduit par une
# absence silencieuse de donnees, pas par une erreur.
#
# Pour ajouter une valeur europeenne, chercher son nom de deposant sur
# https://filings.xbrl.org/ et le recopier tel quel.
# =====================================================================

